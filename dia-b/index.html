<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dia B">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Sessão aposentada</title>
<style>
  * { touch-action:manipulation; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:#0d1117; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#0d1117; color:#e6edf3; max-width:480px; margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));
    font-size:16px; line-height:1.5;
  }
  .card { background:#161b22; border:1px solid #2b3442; border-left:4px solid #eab308; border-radius:14px; padding:18px 16px 8px; }
  h1 { font-size:21px; font-weight:800; letter-spacing:-.2px; margin-bottom:10px; }
  p { font-size:15px; color:#a8b3c1; margin-bottom:12px; }
  p strong { color:#e6edf3; }
  .velha { display:inline-block; color:#58a6ff; font-size:14px; font-weight:700; text-decoration:none; padding:12px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Sessão aposentada</h1>
  <p>A <strong>Matinal DIA B</strong> (vC.12) foi aposentada em 05/10/2026. A sessão atual é a <strong>Mobilidade</strong>.</p>
  <p>Abre pelo ícone <strong>Mobilidade</strong> da Tela de Início.</p>
  <a class="velha" href="vC12/">ver a versão antiga</a>
</div>
</body>
</html>
